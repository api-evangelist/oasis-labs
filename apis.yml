name: Oasis Labs
description: >-
  Oasis Labs builds privacy-preserving data and compute technologies. Its
  developer platform, Parcel, is a data-governance API for uploading, tokenizing,
  and computing over sensitive datasets under programmable access grants, with
  confidential compute jobs and identity/permission management. Oasis Labs also
  ships PrivateSQL (differential-privacy SQL analytics) and privacy-preserving AI
  tooling built on secure enclaves, MPC, homomorphic encryption, and zero-knowledge
  proofs. The company was founded out of UC Berkeley and is backed by a16z, DCVC,
  Pantera Capital, and Polychain. The Parcel REST API is documented at
  docs.oasislabs.com with an official TypeScript SDK and OAuth2 client-credentials
  (private_key_jwt) authentication.
