apis:
- name: Oasis Labs Parcel API
  description: >-
    Parcel is Oasis Labs' data-governance API for uploading and tokenizing
    sensitive data, defining programmable access grants and permissions, running
    confidential compute jobs over that data, and managing identities and apps.
    Authentication is OAuth2 client-credentials using a JWT client assertion
    (private_key_jwt).
